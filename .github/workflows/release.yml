name: Release

# Push a tag `vX.Y.Z` that matches the version in Cargo.toml, plugin.json and
# bin/hk. Builds every target, writes one `.sha256` per asset plus
# SHA256SUMS, and publishes a GitHub Release. The launcher downloads
# `hk-<target>[.exe]` and verifies it against `hk-<target>[.exe].sha256`.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tag matches every version string
        run: |
          tag="${GITHUB_REF_NAME#v}"
          cargo_v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          plugin_v=$(python3 -c 'import json;print(json.load(open(".claude-plugin/plugin.json"))["version"])')
          launcher_v=$(sed -n 's/^VERSION="\(.*\)"/\1/p' bin/hk)
          echo "tag=$tag cargo=$cargo_v plugin=$plugin_v launcher=$launcher_v"
          [ "$tag" = "$cargo_v" ] && [ "$tag" = "$plugin_v" ] && [ "$tag" = "$launcher_v" ]

  build:
    needs: check-version
    name: build ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { target: x86_64-unknown-linux-musl, os: ubuntu-latest, musl: true }
          - { target: aarch64-unknown-linux-musl, os: ubuntu-24.04-arm, musl: true }
          - { target: x86_64-apple-darwin, os: macos-latest }
          - { target: aarch64-apple-darwin, os: macos-latest }
          - { target: x86_64-pc-windows-msvc, os: windows-latest, ext: .exe }
          - { target: aarch64-pc-windows-msvc, os: windows-latest, ext: .exe }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools
      - run: cargo build --release --locked -p hk --target ${{ matrix.target }}
      - name: Package
        shell: bash
        run: |
          mkdir -p dist
          asset="hk-${{ matrix.target }}${{ matrix.ext }}"
          cp "target/${{ matrix.target }}/release/hk${{ matrix.ext }}" "dist/$asset"
          cd dist
          if command -v sha256sum >/dev/null; then
            sha256sum "$asset" > "$asset.sha256"
          else
            shasum -a 256 "$asset" > "$asset.sha256"
          fi
          cat "$asset.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: hk-${{ matrix.target }}
          path: dist/*

  publish:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        run: |
          cd dist
          cat *.sha256 > SHA256SUMS
          cat SHA256SUMS
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --title "$GITHUB_REF_NAME" \
            --notes "See CHANGELOG.md. Verify downloads with SHA256SUMS."
