[workspace]
resolver = "2"
members = ["crates/hk"]

[workspace.package]
version = "1.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Rixmerz/hook-n-hooks"
rust-version = "1.87"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
strip = true
panic = "abort"
